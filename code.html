<!-- Input Group -->
<div class="space-y-2">
<label class="block font-label-bold text-label-bold text-on-surface uppercase tracking-wider" for="login_identifier">
                        Email or Mobile Number
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">account_circle</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-transparent border border-outline text-on-surface font-body-md text-body-md rounded-DEFAULT focus:ring-1 focus:ring-action-yellow focus:border-action-yellow transition-colors placeholder-on-tertiary-container" id="login_identifier" name="login_identifier" placeholder="Enter details" required="" type="text"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-action-yellow hover:bg-surface-tint text-on-primary-fixed font-label-bold text-label-bold uppercase py-4 px-6 rounded-DEFAULT transition-all duration-200 active:scale-[0.98] flex items-center justify-center gap-2" type="submit">

</button>
